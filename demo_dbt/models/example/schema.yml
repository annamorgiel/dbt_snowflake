version: 2

sources:
  - name: music
    description: "my music table"
    database: DEMO_DB
    schema: PUBLIC
    tables:
      - name: album
      - name: artist
      - name: genre
      - name: track
      - name: playlist
      - name: mediatype
      - name: playlisttrack

models:
  - name: my_first_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: my_second_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: stg_artist
    description: "staging for artist"
    config: 
      tags: ['setup']
    columns:
      - name: artist_id
        data_tests:
          - unique
          - not_null

  - name: stg_album
    description: "staging for album"
    config: 
      tags: ['setup']
    columns:
      - name: album_id
        data_tests:
          - unique
          - not_null

  - name: stg_media_type
    description: "staging for media type"
    config: 
      tags: ['setup']
    columns:
      - name: media_type_id
        data_tests:
          - unique
          - not_null

  - name: stg_genre
    description: "staging for genre"
    config: 
      tags: ['setup']
    columns:
      - name: genre_id
        data_tests:
          - unique
          - not_null

  - name: stg_track
    description: "staging for track"
    config: 
      tags: ['setup']
    columns:
      - name: track_id
        data_tests:
          - unique
          - not_null

  - name: stg_playlist
    description: "staging for playlist"
    config: 
      tags: ['setup']
    columns:
      - name: playlist_id
        data_tests:
          - unique
          - not_null

  - name: stg_playlist_track
    description: "staging for playlist track mapping"
    config: 
      tags: ['setup']
    columns:
      - name: playlist_id
        data_tests:
          - not_null
      - name: track_id
        data_tests:
          - not_null